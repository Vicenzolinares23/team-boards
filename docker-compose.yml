services:
  db:
    image: postgres:16-alpine
    container_name: team_boards_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: team
      POSTGRES_PASSWORD: team
      POSTGRES_DB: team_boards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team_boards"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: team_boards_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: team_boards_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://team:team@db:5432/team_boards
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  pgdata: