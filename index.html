<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Smiffs Rips</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0d11;
    color: #f2f5f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 18px calc(40px + env(safe-area-inset-bottom));
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  header { text-align: center; }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: .05em;
    text-transform: uppercase;
  }

  /* SMIFFS RIPS: metallic gold lettering, light at the top of each letter
     running down to a deep bronze, with a soft glow. */
  h1.brand {
    font-size: 2.5rem;
    line-height: 1.1;
    background: linear-gradient(180deg, #fff6c9 0%, #f9d976 30%, #d4a017 58%,
                                #9c6b12 80%, #f3d27a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.7))
            drop-shadow(0 0 6px rgba(247,196,64,.35));
    font-weight: 900;
    letter-spacing: .08em;
  }

  p.sub {
    margin: 8px 0 0;
    color: #8b95a5;
    font-size: .9rem;
    font-weight: 600;
  }

  nav {
    display: grid;
    gap: 14px;
  }

  a.board {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 24px 22px;
    border-radius: 18px;
    border: 2px solid #262b34;
    background: #14171d;
    color: #f2f5f8;
    text-decoration: none;
    font-weight: 800;
    letter-spacing: .04em;
    touch-action: manipulation;
    transition: transform .14s ease, border-color .18s ease, background .18s ease;
  }

  a.board:hover { background: #191d25; }
  a.board:active { transform: scale(.98); }

  a.board .tag {
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: .06em;
  }

  a.board .meta {
    color: #8b95a5;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .02em;
    text-align: right;
  }

  a.board.nba { border-color: #4a3c17; }
  a.board.nba:hover { border-color: #f7b32b; }
  a.board.nba .tag { color: #f7b32b; }

  a.board.nfl { border-color: #1d453a; }
  a.board.nfl:hover { border-color: #4ec9a8; }
  a.board.nfl .tag { color: #4ec9a8; }

  a.board.mlb { border-color: #1f3556; }
  a.board.mlb:hover { border-color: #6aa8ff; }
  a.board.mlb .tag { color: #6aa8ff; }

  footer {
    text-align: center;
    color: #5f6a7a;
    font-size: .76rem;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    a.board { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1 class="brand">Smiffs Rips</h1>
  <p class="sub">Tap-to-cross-off team boards for live card breaks</p>
</header>

<nav>
  <a class="board nba" href="nba.html">
    <span class="tag">NBA</span>
    <span class="meta">30 teams<br>Basketball</span>
  </a>
  <a class="board nfl" href="nfl.html">
    <span class="tag">NFL</span>
    <span class="meta">32 teams<br>Football</span>
  </a>
  <a class="board mlb" href="mlb.html">
    <span class="tag">MLB</span>
    <span class="meta">30 teams<br>Baseball</span>
  </a>
</nav>

<footer>
  Tap a team to cross it off &middot; Tap again to undo &middot; Reset clears the board
</footer>

</body>
</html>
